<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>YourMusicVisualizer — Estándar de la Categoría</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    background: #0B0C10; color: #C5C6C7;
    font-family: 'Inter', sans-serif; display: grid;
    grid-template-columns: 280px 1fr; grid-template-rows: 1fr 88px;
  }
  aside {
    background: #1F2833; padding: 28px; border-right: 1px solid rgba(255,255,255,0.08);
  }
  aside h1 { font-size: 22px; color: #66FCF1; margin-bottom: 24px; }
  .nav-item { padding: 12px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  main { position: relative; background: radial-gradient(circle at center, #141a22 0%, #0B0C10 100%); }
  footer {
    grid-column: 1 / -1; background: #161B22; border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
  }
</style>
</head>
<body>
  <aside>
    <h1>YourMusicVisualizer</h1>
    <div class="nav-item" style="color:#66FCF1; font-weight:600;">● Grafo de Estrellas</div>
    <div class="nav-item">○ Artistas Principales</div>
    <div class="nav-item">○ Géneros Musicales</div>
    <div class="nav-item">○ Canciones Favoritas</div>
  </aside>
  <main>
    <svg width="1160" height="812" viewBox="0 0 1160 812">
      <line x1="580" y1="406" x2="420" y2="290" stroke="#45A29E" stroke-width="1.5" />
      <line x1="580" y1="406" x2="750" y2="320" stroke="#45A29E" stroke-width="1.5" />
      <line x1="580" y1="406" x2="640" y2="560" stroke="#45A29E" stroke-width="1.5" />
      <circle cx="580" cy="406" r="28" fill="#66FCF1" />
      <text x="620" y="412" fill="#FFFFFF" font-size="24" font-weight="700">Daft Punk (64 canciones)</text>
      <circle cx="420" cy="290" r="18" fill="#45A29E" />
      <text x="260" y="295" fill="#C5C6C7" font-size="22" font-weight="600">Justice (38)</text>
      <circle cx="750" cy="320" r="20" fill="#45A29E" />
      <text x="780" y="326" fill="#C5C6C7" font-size="22" font-weight="600">Röyksopp (42)</text>
    </svg>
  </main>
  <footer>
    <div>Reproduciendo: <strong>Veridis Quo — Daft Punk</strong></div>
    <div style="color:#66FCF1; font-weight:600;">[ Zoom al Sector Electrónica ]</div>
  </footer>
</body>
</html>
